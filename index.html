<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arc — Personal Ledger</title><style>@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');:root{--bg:#101512;--card:#19201b;--card2:#222c25;--line:#ffffff12;--text:#f1f4ec;--muted:#9da89e;--mint:#b4f36e;--orange:#ffad68}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#254432 0,transparent 30%),var(--bg);color:var(--text);font:14px Manrope,sans-serif}main{max-width:1180px;margin:auto;padding:28px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.brand{font-size:20px;font-weight:800}.brand em{color:var(--mint);font-style:normal}.user{color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:8px 12px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.balance{min-height:315px;border-radius:28px;padding:31px;background:linear-gradient(135deg,#2c4935,#172119 62%);position:relative;overflow:hidden}.balance:after{content:'';position:absolute;width:300px;height:300px;border:45px solid #b4f36e1c;border-radius:50%;right:-125px;bottom:-170px}.eyebrow{color:#a5c6ab;text-transform:uppercase;letter-spacing:1.4px;font-size:10px;font-weight:800}.balance h1{font-size:clamp(43px,6vw,65px);letter-spacing:-4px;margin:34px 0 7px}.balance p{color:#c0cfbf}.stat-row{display:flex;gap:28px;position:absolute;bottom:28px}.stat strong{display:block;font-size:17px;margin-top:4px}.income{color:var(--mint)}.expense{color:var(--orange)}.summary,.activity,.add{border:1px solid var(--line);background:#151c17;border-radius:25px;padding:23px}.summary h2,.activity h2,.add h2{font-size:14px;margin:0 0 16px}.chart{height:185px;display:flex;align-items:end;gap:13px;padding:8px 0 0}.bar{flex:1;border-radius:7px 7px 0 0;background:linear-gradient(#b4f36e,#577f55);min-height:17px;opacity:.9}.side{display:grid;gap:18px}.budget{background:#242b22;border-radius:25px;padding:23px}.budget h2{margin:0;font-size:14px}.budget b{display:block;font-size:29px;letter-spacing:-2px;margin-top:21px}.budget small{color:var(--muted)}.tip{margin-top:17px;background:#ffffff0b;border-radius:12px;padding:12px;color:#d2dad0;line-height:1.5}.add{grid-column:1/2}.form{display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:8px}.form input,.form select{background:#ffffff0c;border:1px solid #ffffff13;border-radius:11px;padding:11px;color:var(--text);font:inherit;outline:none}.form button{background:var(--mint);border:0;border-radius:11px;padding:0 16px;font-weight:800;color:#162015;cursor:pointer}.activity{grid-column:1/-1}.activity header{display:flex;justify-content:space-between;align-items:center}.activity select{background:transparent;color:var(--muted);border:0;font:inherit}.row{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{display:block;color:var(--muted);margin-top:3px}.row button{color:#859186;background:none;border:0;cursor:pointer}.empty{color:var(--muted);padding:22px 0;text-align:center}@media(max-width:760px){main{padding:18px}.grid{grid-template-columns:1fr}.add{grid-column:auto}.form{grid-template-columns:1fr 1fr}.form input{grid-column:1/-1}.form button{padding:12px}.balance{min-height:290px}}</style><main><nav class="nav"><div class="brand">arc<em>.</em></div><div class="user">Personal finance · INR</div></nav><section class="grid"><section class="balance"><span class="eyebrow">Available balance</span><h1 id="balance">₹0</h1><p>Everything you have, clearly in one place.</p><div class="stat-row"><div class="stat"><span class="eyebrow">In</span><strong class="income" id="in">₹0</strong></div><div class="stat"><span class="eyebrow">Out</span><strong class="expense" id="out">₹0</strong></div></div></section><aside class="side"><section class="summary"><h2>Cash flow</h2><div class="chart" id="chart"></div></section><section class="budget"><h2>This month</h2><b id="spent">₹0 spent</b><small>Keep an eye on your everyday spending.</small><div class="tip">A calm money habit: review your total once a week, not every hour.</div></section></aside><section class="add"><h2>Add a transaction</h2><form id="form" class="form"><input id="title" maxlength="60" placeholder="e.g. Grocery run" required><input id="value" type="number" min="1" placeholder="Amount" required><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select><button>Add</button></form></section><section class="activity"><header><h2>Recent activity</h2><select id="filter"><option value="all">All transactions</option><option value="income">Income</option><option value="expense">Expenses</option></select></header><div id="rows"></div></section></section></main><script>const key='ledger.v1';let items=JSON.parse(localStorage.getItem(key)||'[]');const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let inc=items.filter(x=>x.type==='income').reduce((a,x)=>a+x.value,0),out=items.filter(x=>x.type==='expense').reduce((a,x)=>a+x.value,0);balance.textContent=money(inc-out);document.querySelector('#in').textContent=money(inc);document.querySelector('#out').textContent=money(out);spent.textContent=money(out)+' spent';chart.innerHTML=[32,57,41,74,48,90,66].map((n,i)=>`<i class="bar" style="height:${out?Math.max(15,n)+'%':12+'%'}"></i>`).join('');let shown=items.filter(x=>filter.value==='all'||x.type===filter.value);rows.innerHTML=shown.length?shown.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><small>${new Date(x.date).toLocaleDateString()}</small></div><div class="${x.type}">${x.type==='income'?'+':'−'}${money(x.value)} <button data-id="${x.id}">×</button></div></div>`).join(''):'<div class="empty">No transactions yet — add your first one above.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{items=items.filter(x=>x.id!==b.dataset.id);save()})}function save(){localStorage.setItem(key,JSON.stringify(items));fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})}).catch(()=>{});render()}form.onsubmit=e=>{e.preventDefault();items.unshift({id:crypto.randomUUID(),title:title.value.trim(),value:+value.value,type:type.value,date:Date.now()});e.target.reset();save()};filter.onchange=render;fetch('/api/state').then(r=>r.json()).then(s=>{if(s.items?.length){items=s.items;localStorage.setItem(key,JSON.stringify(items));render()}}).catch(()=>{});render();</script></html>
